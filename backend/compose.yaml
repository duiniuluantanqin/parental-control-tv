services:
  tv-parental:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TV_PARENTAL_DATA_FILE: /data/state.sqlite3
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    expose:
      - "8080"
    restart: unless-stopped
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    depends_on:
      - tv-parental
    environment:
      TV_PARENTAL_DOMAIN: ${TV_PARENTAL_DOMAIN:?set the public domain in backend/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_config:
  caddy_data:
