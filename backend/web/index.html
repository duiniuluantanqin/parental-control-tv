<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>看电视前答题 · 管理后台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">TV</span>
      <div><strong>看电视前答题</strong><small>家长管理</small></div>
    </div>
    <div class="connection">
      <span id="connectionDot" class="dot"></span>
      <span id="connectionText">未连接</span>
    </div>
  </header>

  <main>
    <section class="toolbar" aria-label="管理后台连接">
      <label for="tokenInput">管理员令牌</label>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="粘贴服务器启动时生成的令牌">
      <button id="connectButton" class="button primary" type="button">连接</button>
      <span id="notice" role="status" aria-live="polite"></span>
    </section>

    <section class="settings-section" aria-labelledby="settingsTitle">
      <div class="section-heading">
        <div><h1 id="settingsTitle">每日规则</h1><p>设备同步后生效</p></div>
        <button id="saveSettings" class="button secondary" type="button" disabled>保存设置</button>
      </div>
      <div class="settings-grid">
        <label>每日可用时长 <span class="unit">分钟</span><input id="dailyLimit" type="number" min="1" max="1440" value="60" disabled></label>
        <label>答题间隔 <span class="unit">分钟</span><input id="questionInterval" type="number" min="1" max="240" value="10" disabled></label>
        <label>答错锁定 <span class="unit">分钟</span><input id="wrongLock" type="number" min="1" max="1440" value="10" disabled></label>
        <label>同步间隔 <span class="unit">分钟</span><input id="syncInterval" type="number" min="1" max="60" value="5" disabled></label>
      </div>
    </section>

    <section class="questions-section" aria-labelledby="questionsTitle">
      <div class="section-heading">
        <div><h2 id="questionsTitle">题库 <span id="questionCount" class="count">0</span></h2><p>电视会从题库中随机抽取，当前题目答错后立即锁定。</p></div>
        <div class="filters">
          <label class="sr-only" for="categoryFilter">筛选类别</label>
          <select id="categoryFilter" disabled><option value="">全部类别</option></select>
          <button id="toggleQuestionForm" class="button primary" type="button" disabled>添加题目</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>类别</th><th>题目</th><th>正确答案</th><th>操作</th></tr></thead>
          <tbody id="questionRows"><tr><td colspan="4" class="empty">连接后台以载入题库</td></tr></tbody>
        </table>
      </div>
      <form id="questionForm" class="question-form" hidden>
        <div class="form-heading"><h3>新题目</h3><button id="closeQuestionForm" class="icon-button" type="button" aria-label="关闭">×</button></div>
        <label>题目内容<input id="promptInput" maxlength="240" required></label>
        <div class="form-meta">
          <label>类别<input id="categoryInput" maxlength="40" value="其他" required></label>
          <label>难度<select id="difficultyInput"><option>初中</option><option>小学</option><option>高中</option></select></label>
        </div>
        <div class="options-fields">
          <label>A<input class="option-input" maxlength="120" required></label>
          <label>B<input class="option-input" maxlength="120" required></label>
          <label>C<input class="option-input" maxlength="120" required></label>
          <label>D<input class="option-input" maxlength="120" required></label>
        </div>
        <label class="correct-answer">正确选项<select id="answerInput"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label>
        <div class="form-actions"><button id="cancelQuestion" class="button secondary" type="button">取消</button><button id="submitQuestion" class="button primary" type="submit">保存题目</button></div>
      </form>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
